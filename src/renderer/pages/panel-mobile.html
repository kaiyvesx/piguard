<!-- Mobile Tracking Panel -->
<div class="panel" id="panel-mobile">
  <div class="panel-skeleton-overlay panel-skeleton-mobile is-visible" data-panel-loader="mobile" aria-hidden="true">
    <div class="panel-skeleton-mobile-left">
      <div class="panel-skeleton-card">
        <div class="panel-skeleton-line w-54"></div>
        <div class="panel-skeleton-line w-82"></div>
      </div>
      <div class="panel-skeleton-card">
        <div class="panel-skeleton-line w-46"></div>
        <div class="panel-skeleton-line w-78"></div>
        <div class="panel-skeleton-line w-64"></div>
      </div>
      <div class="panel-skeleton-card">
        <div class="panel-skeleton-line w-58"></div>
        <div class="panel-skeleton-line w-74"></div>
      </div>
    </div>
    <div class="panel-skeleton-mobile-right">
      <div class="panel-skeleton-map"></div>
      <div class="panel-skeleton-card">
        <div class="panel-skeleton-line w-42"></div>
        <div class="panel-skeleton-line w-68"></div>
      </div>
    </div>
  </div>
  <div class="tracking-shell">
    <aside class="tracking-devices-pane" id="trackingDevicesPane">
      <div class="tracking-pane-header">
        <div class="tracking-pane-head-copy">
          <h3 class="tracking-pane-title">Mobile Devices</h3>
          <p class="tracking-pane-subtitle" id="mobileTrackingStatus">Waiting for device presence updates...</p>
        </div>
        <button
          type="button"
          class="tracking-pane-toggle"
          id="trackingPaneToggle"
          aria-expanded="true"
          aria-controls="trackingDevicesPane"
          title="Collapse devices pane"
        >
          <span class="tracking-pane-toggle-text" id="trackingPaneToggleText">Hide</span>
          <span class="tracking-pane-toggle-icon" id="trackingPaneToggleIcon">&#9664;</span>
        </button>
      </div>

      <div class="tracking-device-cards" id="trackingDeviceCards">
        <div class="tracking-device-empty">No devices seen yet. Device cards appear automatically when mobile apps connect.</div>
      </div>
    </aside>

    <section class="tracking-map-pane" aria-label="Live mobile location map">
      <div id="mobile-map"></div>

      <div class="tracking-map-badge">
        <div id="mobileGpsCoords">No active mobile tracking</div>
        <div id="trackingMapHint">HTTP log polling active. Device markers and routes update every poll.</div>
      </div>

      <section
        id="trackingGpsEventLog"
        style="position:absolute;right:12px;left:auto;bottom:12px;z-index:4;width:min(360px,calc(100% - 24px));border:1px solid rgba(95,150,219,.45);border-radius:10px;background:rgba(6,16,31,.9);box-shadow:0 8px 18px rgba(0,0,0,.3);"
      >
        <header style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 10px;border-bottom:1px solid rgba(95,150,219,.28);">
          <div style="color:#deeeff;font-size:.64rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;">GPS Event Log</div>
          <div id="trackingGpsEventCount" style="color:#9fb9d6;font-size:.62rem;">0 events</div>
        </header>
        <div
          id="trackingGpsEventList"
          style="max-height:96px;overflow-y:auto;padding:6px 10px 8px;display:flex;flex-direction:column;gap:4px;font-size:.64rem;"
        >
          <div class="tracking-log-empty">No GPS events yet.</div>
        </div>
      </section>
    </section>
  </div>

  <!-- Compatibility placeholders for legacy tracking UI hooks -->
  <div id="trackingRequestsMobile" class="tracking-compat-hidden"></div>
  <table class="tracking-compat-hidden"><tbody id="trackingDeviceRowsMobile"></tbody></table>

</div>
