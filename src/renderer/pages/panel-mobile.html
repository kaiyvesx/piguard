<!-- Mobile Tracking Panel -->
<div class="panel" id="panel-mobile">
  <div class="tracking-shell">
    <aside class="tracking-devices-pane" id="trackingDevicesPane">
      <div class="tracking-pane-header">
        <div class="tracking-pane-head-copy">
          <h3 class="tracking-pane-title">Mobile Devices</h3>
          <p class="tracking-pane-subtitle" id="mobileTrackingStatus">Waiting for device presence updates...</p>
        </div>
        <button
          type="button"
          class="tracking-pane-toggle"
          id="trackingPaneToggle"
          aria-expanded="true"
          aria-controls="trackingDevicesPane"
          title="Collapse devices pane"
        >
          <span class="tracking-pane-toggle-text" id="trackingPaneToggleText">Hide</span>
          <span class="tracking-pane-toggle-icon" id="trackingPaneToggleIcon">&#9664;</span>
        </button>
      </div>

      <div class="tracking-device-cards" id="trackingDeviceCards">
        <div class="tracking-device-empty">No devices seen yet. Device cards appear automatically when mobile apps connect.</div>
      </div>
    </aside>

    <section class="tracking-map-pane" aria-label="Live mobile location map">
      <div id="mobile-map"></div>

      <div class="tracking-map-badge">
        <div id="mobileGpsCoords">No active mobile tracking</div>
        <div id="trackingMapHint">Manual map view. Device markers and routes update in real time.</div>
      </div>
    </section>
  </div>

  <!-- Compatibility placeholders for legacy tracking UI hooks -->
  <div id="trackingRequestsMobile" class="tracking-compat-hidden"></div>
  <table class="tracking-compat-hidden"><tbody id="trackingDeviceRowsMobile"></tbody></table>

  <!-- Bootstrap mobile GPS response wiring for sidebar location log and manual get_gps command -->
  <img
    src="x"
    alt=""
    class="tracking-compat-hidden"
    onerror="this.onerror=null;this.remove();if(window.__piguardGpsPanelBootstrapped){return;}window.__piguardGpsPanelBootstrapped=true;window.__piguardGpsEvents=[];window.__piguardFriendlyDeviceName=function(deviceId){var id=String(deviceId||'').trim();var match=id.match(/^mobile-sim-(\d+)$/i);if(match){return 'Sim User '+String(match[1]).padStart(3,'0');}return id||'Unknown Device';};window.__piguardFormatSidebarTime=function(ts){var d=new Date(ts||Date.now());if(Number.isNaN(d.getTime())){return '--:--:--';}return d.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit', second:'2-digit' });};window.__piguardRenderSidebarLocationLog=function(){var list=document.getElementById('sidebarLocationLogList');if(!list){return;}var lines=(window.__piguardGpsEvents||[]).slice(-10).reverse();if(!lines.length){list.innerHTML='<div class=\'tracking-sidebar-location-empty\'>No location events yet.</div>';return;}list.innerHTML=lines.map(function(entry){var name=window.__piguardFriendlyDeviceName(entry.deviceId);var lat=Number(entry.lat);var lng=Number(entry.lng);var latText=Number.isFinite(lat)?lat.toFixed(5):'--';var lngText=Number.isFinite(lng)?lng.toFixed(5):'--';return '<div class=\'tracking-sidebar-location-line\'>['+window.__piguardFormatSidebarTime(entry.timestamp)+'] '+name+' ['+latText+', '+lngText+']</div>';}).join('');};window.getGPS=async function(deviceId){if(!window.electronAPI||typeof window.electronAPI.invoke!=='function'){throw new Error('electronAPI.invoke is unavailable');}var result=await window.electronAPI.invoke('send-gps-command', deviceId);console.log('[Panel] GPS command sent:', result);return result;};if(window.electronAPI&&typeof window.electronAPI.on==='function'){window.electronAPI.on('mobile:gps_response', function(_event, data){if(!data||typeof data!=='object'){return;}window.__piguardGpsEvents.push({deviceId:String(data.deviceId||''),lat:Number(data.lat),lng:Number(data.lng),requestId:String(data.requestId||''),timestamp:String(data.timestamp||new Date().toISOString())});while(window.__piguardGpsEvents.length>50){window.__piguardGpsEvents.shift();}window.__piguardRenderSidebarLocationLog();window.dispatchEvent(new CustomEvent('mobile:gps_response',{detail:data}));});}document.addEventListener('click', function(evt){var target=evt.target&&evt.target.closest?evt.target.closest('.tracking-action-btn[data-action=get_gps]'):null;if(!target){return;}evt.preventDefault();evt.stopPropagation();if(typeof evt.stopImmediatePropagation==='function'){evt.stopImmediatePropagation();}var deviceId=String(target.getAttribute('data-device-id')||'').trim();if(deviceId){window.getGPS(deviceId).catch(function(err){console.warn('[Panel] Failed to send get_gps command:', err&&err.message?err.message:err);});}}, true);setInterval(function(){window.__piguardRenderSidebarLocationLog();var cards=document.querySelectorAll('#trackingDeviceCards .tracking-device-card');cards.forEach(function(card){var deviceId=String(card.getAttribute('data-device-id')||'').trim();var label=card.querySelector('.tracking-device-id');if(label){label.textContent=window.__piguardFriendlyDeviceName(deviceId);label.title=deviceId;}});}, 1200);"
  />

  <img
    src="x"
    alt=""
    class="tracking-compat-hidden"
    onerror="this.onerror=null;this.remove();if(window.__piguardSavedDeviceBootstrap){return;}window.__piguardSavedDeviceBootstrap=true;window.lastSeenText=function(timestamp){if(!timestamp){return 'never';}var diffMs=Date.now()-new Date(timestamp).getTime();if(!Number.isFinite(diffMs)){return 'never';}var mins=Math.floor(diffMs/60000);if(mins<1){return 'just now';}if(mins<60){return mins+'m ago';}var hrs=Math.floor(mins/60);if(hrs<24){return hrs+'h ago';}return Math.floor(hrs/24)+'d ago';};window.showDeviceOnMap=window.showDeviceOnMap||function(deviceId,lat,lng,isOnline){window.dispatchEvent(new CustomEvent('piguard:restore-device-location',{detail:{device_id:String(deviceId||''),lat:Number(lat),lng:Number(lng),online:!!isOnline}}));};window.showDeviceCard=window.showDeviceCard||function(device){window.dispatchEvent(new CustomEvent('piguard:restore-device-card',{detail:device||{}}));};window.__piguardRenderSidebarLocationLog=function(){var list=document.getElementById('sidebarLocationLogList');if(!list){return;}var lines=(window.__piguardGpsEvents||[]).slice(-10).reverse();if(!lines.length){list.innerHTML='<div class=\'tracking-sidebar-location-empty\'>No location events yet.</div>';return;}list.innerHTML=lines.map(function(entry){var name=window.__piguardFriendlyDeviceName?window.__piguardFriendlyDeviceName(entry.deviceId):String(entry.deviceId||'Unknown Device');var lat=Number(entry.lat);var lng=Number(entry.lng);var latText=Number.isFinite(lat)?lat.toFixed(5):'--';var lngText=Number.isFinite(lng)?lng.toFixed(5):'--';var ago=window.lastSeenText(entry.timestamp||entry.last_seen);return '<div class=\'tracking-sidebar-location-line\'>'+name+' ['+latText+', '+lngText+'] '+ago+'</div>';}).join('');};window.loadSavedDevices=async function(){if(!window.electronAPI||typeof window.electronAPI.invoke!=='function'){return;}var result=await window.electronAPI.invoke('get-device-list');var devices=Array.isArray(result)?result:(result&&Array.isArray(result.data)?result.data:[]);console.log('[Panel] Loaded saved devices:', devices.length);if(!Array.isArray(window.__piguardGpsEvents)){window.__piguardGpsEvents=[];}devices.forEach(function(device){if(!device||typeof device!=='object'){return;}var deviceId=String(device.device_id||'').trim();if(!deviceId){return;}var location=device.last_location&&typeof device.last_location==='object'?device.last_location:null;if(location){var lat=Number(location.lat!=null?location.lat:location.latitude);var lng=Number(location.lng!=null?location.lng:location.longitude);if(Number.isFinite(lat)&&Number.isFinite(lng)){window.__piguardGpsEvents.push({deviceId:deviceId,lat:lat,lng:lng,requestId:'persisted',timestamp:String(location.timestamp||device.last_seen||new Date().toISOString()),last_seen:String(device.last_seen||'')});window.showDeviceOnMap(deviceId,lat,lng,device.status==='online');}}window.showDeviceCard(device);});while(window.__piguardGpsEvents.length>50){window.__piguardGpsEvents.shift();}window.__piguardRenderSidebarLocationLog();};window.loadSavedDevices().catch(function(err){console.warn('[Panel] Failed to load saved devices:', err&&err.message?err.message:err);});"
  />
</div>
