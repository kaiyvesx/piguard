<!-- Mobile Tracking Panel -->
<div class="panel" id="panel-mobile">
  <div class="tracking-shell">
    <aside class="tracking-devices-pane" id="trackingDevicesPane">
      <div class="tracking-pane-header">
        <div class="tracking-pane-head-copy">
          <h3 class="tracking-pane-title">Mobile Devices</h3>
          <p class="tracking-pane-subtitle" id="mobileTrackingStatus">Waiting for device presence updates...</p>
        </div>
        <button
          type="button"
          class="tracking-pane-toggle"
          id="trackingPaneToggle"
          aria-expanded="true"
          aria-controls="trackingDevicesPane"
          title="Collapse devices pane"
        >
          <span class="tracking-pane-toggle-text" id="trackingPaneToggleText">Hide</span>
          <span class="tracking-pane-toggle-icon" id="trackingPaneToggleIcon">&#9664;</span>
        </button>
      </div>

      <div class="tracking-device-cards" id="trackingDeviceCards">
        <div class="tracking-device-empty">No devices seen yet. Device cards appear automatically when mobile apps connect.</div>
      </div>
    </aside>

    <section class="tracking-map-pane" aria-label="Live mobile location map">
      <div id="mobile-map"></div>

      <div class="tracking-map-badge">
        <div id="mobileGpsCoords">No active mobile tracking</div>
        <div id="trackingMapHint">Manual map view. Device markers and routes update in real time.</div>
      </div>
    </section>
  </div>

  <!-- Compatibility placeholders for legacy tracking UI hooks -->
  <div id="trackingRequestsMobile" class="tracking-compat-hidden"></div>
  <table class="tracking-compat-hidden"><tbody id="trackingDeviceRowsMobile"></tbody></table>

  <!-- Bootstrap mobile GPS response wiring for manual get_gps command -->
  <img
    src="x"
    alt=""
    class="tracking-compat-hidden"
    onerror="this.onerror=null;this.remove();if(window.__piguardGpsPanelBootstrapped){return;}window.__piguardGpsPanelBootstrapped=true;window.__piguardFriendlyDeviceName=window.__piguardFriendlyDeviceName||function(deviceId){var id=String(deviceId||'').trim();var match=id.match(/^mobile-sim-(\d+)$/i);if(match){return 'Sim User '+String(match[1]).padStart(3,'0');}return id||'Unknown Device';};window.getGPS=async function(deviceId){if(!window.electronAPI||typeof window.electronAPI.invoke!=='function'){throw new Error('electronAPI.invoke is unavailable');}var result=await window.electronAPI.invoke('send-gps-command', deviceId);console.log('[Panel] GPS command sent:', result);return result;};if(window.electronAPI&&typeof window.electronAPI.on==='function'){window.electronAPI.on('mobile:gps_response', function(_event, data){if(!data||typeof data!=='object'){return;}window.dispatchEvent(new CustomEvent('mobile:gps_response',{detail:data}));window.dispatchEvent(new CustomEvent('piguard:mobile-gps',{detail:data}));window.dispatchEvent(new CustomEvent('piguard:supabase-refresh'));});}document.addEventListener('click', function(evt){var target=evt.target&&evt.target.closest?evt.target.closest('.tracking-action-btn[data-action=get_gps]'):null;if(!target){return;}evt.preventDefault();evt.stopPropagation();if(typeof evt.stopImmediatePropagation==='function'){evt.stopImmediatePropagation();}var deviceId=String(target.getAttribute('data-device-id')||'').trim();if(deviceId){window.getGPS(deviceId).catch(function(err){console.warn('[Panel] Failed to send get_gps command:', err&&err.message?err.message:err);});}}, true);setInterval(function(){var cards=document.querySelectorAll('#trackingDeviceCards .tracking-device-card');cards.forEach(function(card){var deviceId=String(card.getAttribute('data-device-id')||'').trim();var label=card.querySelector('.tracking-device-id');if(label){label.textContent=window.__piguardFriendlyDeviceName(deviceId);label.title=deviceId;}});}, 1200);"
  />

  <img
    src="x"
    alt=""
    class="tracking-compat-hidden"
    onerror="this.onerror=null;this.remove();if(window.__piguardSupabasePanelBootstrapped){return;}window.__piguardSupabasePanelBootstrapped=true;window.lastSeenText=window.lastSeenText||function(timestamp){if(!timestamp){return 'never';}var diffMs=Date.now()-new Date(timestamp).getTime();if(!Number.isFinite(diffMs)){return 'never';}var mins=Math.floor(diffMs/60000);if(mins<1){return 'just now';}if(mins<60){return mins+'m ago';}var hrs=Math.floor(mins/60);if(hrs<24){return hrs+'h ago';}return Math.floor(hrs/24)+'d ago';};window.__piguardEmitSupabaseDevices=function(devices){window.dispatchEvent(new CustomEvent('piguard:supabase-devices',{detail:{devices:Array.isArray(devices)?devices:[]}}));};window.__piguardLoadSupabaseDevices=async function(){if(!window.electronAPI||typeof window.electronAPI.invoke!=='function'){return [];}var result=await window.electronAPI.invoke('supabase:get-devices');var devices=Array.isArray(result)?result:(result&&Array.isArray(result.data)?result.data:[]);console.log('[Panel] Loaded Supabase devices:', devices.length);window.__piguardEmitSupabaseDevices(devices);return devices;};window.addEventListener('piguard:supabase-refresh', function(){if(window.__piguardSupabaseRefreshTimer){clearTimeout(window.__piguardSupabaseRefreshTimer);}window.__piguardSupabaseRefreshTimer=setTimeout(function(){window.__piguardLoadSupabaseDevices().catch(function(err){console.warn('[Panel] Failed to refresh Supabase devices:', err&&err.message?err.message:err);});}, 1200);});window.__piguardLoadSupabaseDevices().catch(function(err){console.warn('[Panel] Failed to load Supabase devices:', err&&err.message?err.message:err);});"
  />

</div>
