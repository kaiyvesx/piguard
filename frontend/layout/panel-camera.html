<!-- Camera Panel -->
<div class="panel" id="panel-camera">
  <div class="camera-toolbar">
    <h2>Camera Feeds</h2>
    <div class="cam-toolbar-right">
      <button type="button" class="cam-chip active" id="cameraModeLiveBtn">Live</button>
      <button type="button" class="cam-chip" id="cameraModeSnapshotBtn">Snapshot</button>
      <button type="button" class="cam-chip" id="cameraRefreshBtn">Refresh</button>
      <div class="camera-connection" id="cameraConnectionLabel">Waiting for backend...</div>
    </div>
  </div>

  <div class="cam-grid" id="cameraGrid"></div>
</div>
