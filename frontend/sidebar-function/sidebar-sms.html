<div id="sidebarSms" style="display:none">
  <div class="section-label">Contacts</div>
  <div style="padding:0 12px 8px">
    <div style="background:var(--surface-1);border:1px solid var(--card-border);border-radius:8px;padding:10px 12px">
      <div style="font-size:.7rem;color:var(--muted);margin-bottom:6px">Quick Stats</div>
      <div style="display:flex;justify-content:space-between">
        <div style="text-align:center"><div id="sms-stat-unread" style="font-size:1rem;font-weight:700;color:var(--primary)">0</div><div style="font-size:.6rem;color:var(--muted)">Incoming</div></div>
        <div style="text-align:center"><div id="sms-stat-total" style="font-size:1rem;font-weight:700;color:var(--text)">0</div><div style="font-size:.6rem;color:var(--muted)">Total</div></div>
        <div style="text-align:center"><div id="sms-stat-online" style="font-size:1rem;font-weight:700;color:var(--success)">0</div><div style="font-size:.6rem;color:var(--muted)">Contacts</div></div>
      </div>
    </div>
  </div>
  <div style="padding:0 12px 12px">
    <div style="background:var(--surface-1);border:1px solid var(--card-border);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px">
      <button class="btn-add-number" id="smsNewMessageBtn" type="button" title="Start new message" style="width:100%">New message</button>
      <button class="btn-add-number" id="smsAddNumberBtn" type="button" title="Add number" style="width:100%">Add number</button>
      <div class="sms-extra-toolbar" id="smsExtraRow" hidden style="padding:0;border-bottom:none">
        <input class="compose-input compose-extra-input" id="smsExtraNumberInput" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="11" placeholder="Enter 11-digit number" />
        <div class="sms-extra-hint" id="smsExtraHint">Numbers only, up to 11 digits.</div>
      </div>
    </div>
  </div>
</div>
