name: Build Windows Installer (manual)

on:
  workflow_dispatch:

jobs:
  build-windows-manual:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install npm dependencies
        run: npm ci

      - name: Build backend executable (PyInstaller)
        shell: powershell
        run: npm run build-backend

      - name: Build Electron installer (NSIS)
        shell: powershell
        run: npm run dist

      - name: Upload installer and artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PiGuard-windows-artifacts
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.msi
            dist/*.7z
